name: process-transactions

# Triggers:
#   - schedule: backstop runs so nothing is ever stranded.
#   - workflow_dispatch: manual "Run workflow" button.
#   - repository_dispatch (type raw_event): fired by a Supabase Database Webhook
#     the instant a raw_events row is inserted (near-real-time processing).
# Reads new raw_events from Supabase, writes normalized transactions.

on:
  schedule:
    # Times are UTC; user is Asia/Bangkok (UTC+7).
    # 02:00 BKK -> 19 UTC
    - cron: "0 19 * * *"
  workflow_dispatch: {} # manual "Run workflow" button
  repository_dispatch:
    types: [raw_event] # fired by the Supabase webhook on new raw_events

# Avoid overlapping runs if one is slow.
concurrency:
  group: process-transactions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract OCR (Thai + English)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tha

      - name: Install dependencies
        run: pip install -r requirements-processor.txt

      # Debounce: on a webhook trigger, wait ~1 min so a slip image and its
      # paired app notification both land in raw_events before we process — this
      # lets internal-transfer detection and recipient-credit reconciliation see
      # both sides in one run. Scheduled/manual runs skip the wait.
      - name: Debounce paired events
        if: github.event_name == 'repository_dispatch'
        run: sleep 60

      - name: Run processor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OWNER_NAMES: ${{ secrets.OWNER_NAMES }}
          SLIP_PROVIDER: ${{ secrets.SLIP_PROVIDER }}
          EASYSLIP_API_KEY: ${{ secrets.EASYSLIP_API_KEY }}
          KBANK_STATEMENT_PASSWORD: ${{ secrets.KBANK_STATEMENT_PASSWORD }}
          LOCAL_TZ: Asia/Bangkok
        run: python -m src.process